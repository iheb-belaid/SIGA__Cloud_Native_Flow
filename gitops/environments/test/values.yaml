namespace: cloud-native-flow
namespaceCreate: true
environment: test

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/iheb-belaid/todo-backend
    tag: sha-placeholder
    pullPolicy: IfNotPresent
  containerPort: 8081
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  env:
    SPRING_PROFILES_ACTIVE: prod
    # Allow the VM IP used by the port-forward and local browser URLs.
    APP_CORS_ALLOWED_ORIGINS: http://todo.local,http://192.168.172.128:4200,http://localhost:4200,http://127.0.0.1:4200
  probes:
    startupPath: /actuator/health
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    startupInitialDelaySeconds: 20
    startupPeriodSeconds: 10
    startupFailureThreshold: 18
    livenessInitialDelaySeconds: 90
    livenessPeriodSeconds: 15
    livenessFailureThreshold: 3
    readinessInitialDelaySeconds: 45
    readinessPeriodSeconds: 10
    readinessFailureThreshold: 6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/iheb-belaid/todo-frontend
    tag: sha-placeholder
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  createSecret: true
  auth:
    database: todo_db
    username: todo_user
    password: change-me-in-test
    passwordSecretName: todo-postgres-secret
  service:
    port: 5432
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: todo.local
  annotations: {}
