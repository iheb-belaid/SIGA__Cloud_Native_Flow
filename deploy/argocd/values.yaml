global:
  domain: argocd.local

configs:
  cm:
    # MicroK8s serves local ingress traffic without publishing a LoadBalancer address.
    "resource.customizations.health.networking.k8s.io_Ingress": |
      hs = {}
      hs.status = "Healthy"
      hs.message = "MicroK8s ingress is available without a LoadBalancer address."
      return hs
  params:
    server.insecure: true

server:
  service:
    type: ClusterIP
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: monitoring

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: monitoring
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

applicationSet:
  enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      additionalLabels:
        release: monitoring

notifications:
  enabled: false
