{{- if .Values.postgres.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-platform.postgresSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-platform.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.auth.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
