name: Release And GitOps

on:
  workflow_run:
    workflows:
      - Quality And Security
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-gitops-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare-release:
    name: Build Release Images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - Linux
    timeout-minutes: 45

    steps:
      - name: Checkout repository from quality workflow commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Checkout repository for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            FULL_SHA="${GITHUB_SHA}"
          fi

          SHORT_SHA="${FULL_SHA::7}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ env.REGISTRY }}/${OWNER_LC}/todo-backend:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${OWNER_LC}/todo-frontend:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image for release
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tags.outputs.backend_image }}

      - name: Build frontend Docker image for release
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tags.outputs.frontend_image }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-tags.outputs.backend_image }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-tags.outputs.frontend_image }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push backend image to GHCR
        run: docker push "${{ steps.image-tags.outputs.backend_image }}"

      - name: Push frontend image to GHCR
        run: docker push "${{ steps.image-tags.outputs.frontend_image }}"
