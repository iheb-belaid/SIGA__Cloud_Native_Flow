name: Release And GitOps

on:
  workflow_run:
    workflows:
      - Quality And Security
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-gitops-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  GITOPS_IMAGE_TAGS_FILE: gitops/environments/test/image-tags.yaml
  # Keep Trivy's large vulnerability and Java databases outside the persistent
  # GitHub workspace on the self-hosted runner.
  TRIVY_CACHE_DIR: /home/iheb-belaid/.cache/trivy

jobs:
  prepare-release:
    name: Build Release Images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - Linux
    timeout-minutes: 45

    steps:
      - name: Checkout repository from quality workflow commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Checkout repository for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cleanup disposable Docker data
        run: |
          set -euo pipefail
          # The MicroK8s runtime uses containerd, so this cleanup does not
          # remove images or volumes used by the Kubernetes workloads.
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image-tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            FULL_SHA="${GITHUB_SHA}"
          fi

          SHORT_SHA="${FULL_SHA::7}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ env.REGISTRY }}/${OWNER_LC}/todo-backend:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${OWNER_LC}/todo-frontend:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image for release
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tags.outputs.backend_image }}

      - name: Build frontend Docker image for release
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tags.outputs.frontend_image }}

      - name: Prepare runner disk for Trivy
        run: |
          set -euo pipefail
          mkdir -p "${TRIVY_CACHE_DIR}"

          # Buildx cache is disposable; removing it prevents old image layers
          # from competing with Trivy's Java database for VM disk space.
          docker builder prune -af || true

          AVAILABLE_KB=$(df --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          if [ "$AVAILABLE_KB" -lt 4194304 ]; then
            echo "::error::Less than 4 GiB is available on the runner filesystem after the Docker build. Clean or expand the VM disk before running Trivy."
            df -h "$GITHUB_WORKSPACE"
            exit 1
          fi

          df -h "$GITHUB_WORKSPACE"

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-tags.outputs.backend_image }}
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          format: table
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 30m

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-tags.outputs.frontend_image }}
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
          format: table
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          timeout: 30m

      - name: Push backend image to GHCR
        run: docker push "${{ steps.image-tags.outputs.backend_image }}"

      - name: Push frontend image to GHCR
        run: docker push "${{ steps.image-tags.outputs.frontend_image }}"

      - name: Update GitOps image tags file
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p "$(dirname "${{ env.GITOPS_IMAGE_TAGS_FILE }}")"

          cat > "${{ env.GITOPS_IMAGE_TAGS_FILE }}" <<EOF
          backend:
            image:
              repository: ${{ env.REGISTRY }}/${OWNER_LC}/todo-backend
              tag: sha-${{ steps.image-tags.outputs.short_sha }}

          frontend:
            image:
              repository: ${{ env.REGISTRY }}/${OWNER_LC}/todo-frontend
              tag: sha-${{ steps.image-tags.outputs.short_sha }}
          EOF

      - name: Commit GitOps image tag update
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            TARGET_BRANCH="${GITHUB_REF_NAME}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.GITOPS_IMAGE_TAGS_FILE }}"

          if git diff --cached --quiet; then
            echo "No GitOps change detected."
            exit 0
          fi

          git commit -m "chore(gitops): update test image tags for sha-${{ steps.image-tags.outputs.short_sha }}"
          git push origin "HEAD:${TARGET_BRANCH}"
